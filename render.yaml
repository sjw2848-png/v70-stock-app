services:
  - type: web
    name: v78-4-stock-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "120"
      - key: MIN_REQUEST_GAP_SECONDS
        value: "2"
      - key: DATA_DIR
        value: "/var/data"
      - key: APP_PIN
        sync: false
      - key: DATABASE_URL
        sync: false

# V78.8.1 persistence: Free Render web services cannot use persistent disks.
# Set DATABASE_URL to a persistent PostgreSQL database for durable accounts/portfolios.
# On a paid Render web service you can alternatively attach a disk at /var/data.
