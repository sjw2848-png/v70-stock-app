services:
  - type: web
    name: v78-4-stock-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "120"
      - key: MIN_REQUEST_GAP_SECONDS
        value: "2"
      - key: DATA_DIR
        value: "/var/data"
      - key: APP_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: v78-stock-db
          property: connectionString

databases:
  - name: v78-stock-db
    plan: free
    databaseName: v78_stock
    user: v78_stock_user

# V78.9.0
# Blueprint deployment automatically injects the PostgreSQL internal connection string.
# To reuse an existing lottery PostgreSQL instead, remove the databases/fromDatabase mapping
# and set the Stock Web Service DATABASE_URL once to that database's Internal URL.
# Stock data is isolated in stock_app_state / stock_app_storage_probe tables.
