services:
  - type: web
    name: v78-4-stock-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: CACHE_TTL_SECONDS
        value: "120"
      - key: MIN_REQUEST_GAP_SECONDS
        value: "2"
      - key: SEARCH_CACHE_TTL_SECONDS
        value: "90"
      - key: APP_PIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: v78-stock-db
          property: connectionString

databases:
  - name: v78-stock-db
    plan: free
    databaseName: v78_stock
    user: v78_stock_user

# V78.13.0 (DATA_DIR removed: the free plan has no persistent disk; PostgreSQL is the durable store)
# Blueprint deployment automatically injects the PostgreSQL internal connection string.
# To reuse an existing lottery PostgreSQL instead, remove the databases/fromDatabase mapping
# and set the Stock Web Service DATABASE_URL once to that database's Internal URL.
# Stock data is isolated in stock_app_state / stock_app_storage_probe tables.
